<!doctype html>
<html lang="en" data-motion="normal" data-theme="night"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Seed — Bedrock Seed Hunter</title>
<style>
:root{--bg:#061018;--card:#101c2c;--ink:#eaf3fb;--muted:#8aa0b8;--accent:#3ee0c3;--line:#22364c;--good:#5ad67a;--glow:#14344c;--btnink:#06221f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:var(--ink);font-family:Segoe UI,system-ui,sans-serif}
body{background:radial-gradient(900px 500px at 8% -8%,var(--glow) 0%,var(--bg) 55%);background-color:var(--bg)}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav.side{background:color-mix(in srgb,var(--card) 92%,transparent);border-right:1px solid var(--line);padding:20px 14px}
h1{margin:0;letter-spacing:.2em;color:var(--accent)}
.sub,.lead,.note{color:var(--muted);line-height:1.45}
.nav{display:block;width:100%;text-align:left;padding:10px 12px;margin:0 0 5px;color:var(--ink);background:0;border:0;border-radius:10px;cursor:pointer}
.nav.active,.nav:hover{background:#0003}
main{padding:24px 28px 50px;max-width:1180px}
.card{background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.row,.themes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:#0003;border:1px solid var(--line);border-radius:10px;padding:10px}.stat b{display:block;font-size:18px;margin-top:3px}
button{background:var(--accent);color:var(--btnink);border:0;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}
button.secondary{background:#0004;color:var(--ink)}button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button.danger{background:#3a1717;color:#ffb4b4}
input,select{background:#0004;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
.badge.VALIDATED{background:#16351f;color:var(--good)}.badge.APPROXIMATE{background:#3a2e12;color:#e7b549}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}tr{cursor:pointer}
.cond{display:grid;grid-template-columns:1fr 88px 120px 36px;gap:8px;background:#0003;border:1px dashed var(--line);border-radius:10px;padding:10px;margin:8px 0}
.bar{height:18px;background:#0004;border-radius:99px;overflow:hidden;border:1px solid var(--line);position:relative}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#fff6)}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.match{font-weight:800;color:var(--good)}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}
.tracklist button{width:100%;text-align:left;margin:4px 0}
.tracklist button.on{outline:2px solid var(--accent)}
html[data-motion=off] .card{animation:none}
html[data-theme=night]{--bg:#061018;--card:#101c2c;--accent:#3ee0c3;--glow:#14344c}
html[data-theme=cherry]{--bg:#2a1520;--card:#3a1d2c;--ink:#ffeaf3;--muted:#e7b0c6;--accent:#ff9fc4;--line:#6a3348;--glow:#5a2438}

html[data-theme=space]{--bg:#07061a;--card:#14122c;--ink:#efeaff;--muted:#a9a0d8;--accent:#b48cff;--line:#322e5a;--glow:#24184a}
html[data-theme=car]{--bg:#0a1018;--card:#171e28;--accent:#ff3b3b;--line:#3a2228;--glow:#1a2434;--btnink:#fff}
html[data-theme=nether]{--bg:#1a0808;--card:#2a1010;--ink:#ffe8e0;--muted:#d49a8a;--accent:#ff7a3a;--line:#5a2020;--glow:#3a1010}
html[data-theme=end]{--bg:#120816;--card:#22122c;--ink:#f3e8ff;--muted:#c3a0d8;--accent:#d48cff;--line:#4a2a5a;--glow:#2a1038}
html[data-theme=ocean]{--bg:#062028;--card:#0c2c38;--ink:#e8fbff;--muted:#8ad0d8;--accent:#3ee0ff;--line:#1a4a58;--glow:#0a3844}
html[data-theme=desert]{--bg:#2a1c0c;--card:#3a2814;--ink:#fff3e0;--muted:#d4b48a;--accent:#e7b549;--line:#5a4020;--glow:#3a2810}
html[data-theme=snow]{--bg:#d8e6f0;--card:#f4f8fc;--ink:#163049;--muted:#4a6580;--accent:#2a88c8;--line:#b8c8d8;--glow:#fff;--btnink:#fff}
html[data-theme=deep]{--bg:#06140e;--card:#0c2418;--ink:#e8fff3;--muted:#8ab8a0;--accent:#5ad67a;--line:#1a3a28;--glow:#0a2818}
html[data-theme=village]{--bg:#1c140c;--card:#2c2014;--ink:#fff4e4;--muted:#c8b090;--accent:#e0a050;--line:#4a3820;--glow:#3a2814}
html[data-theme=mansion]{--bg:#101410;--card:#1c2418;--ink:#eaf3e4;--muted:#a0b890;--accent:#8ad67a;--line:#2a3828;--glow:#182018}
@media(max-width:900px){.layout,.grid2,.cond{grid-template-columns:1fr}}
</style></head>
<body>
<div class="layout">
<nav class="side">

<script>
const S={village:{id:"village",label:"Village",spacing:27,spawnRange:17,salt:10387312,num:4,acc:"VALIDATED"},desert_pyramid:{id:"desert_pyramid",label:"Desert pyramid",spacing:32,spawnRange:24,salt:14357617,num:2,acc:"VALIDATED"},jungle_temple:{id:"jungle_temple",label:"Jungle temple",spacing:32,spawnRange:24,salt:14357617,num:2,acc:"VALIDATED"},swamp_hut:{id:"swamp_hut",label:"Swamp hut",spacing:32,spawnRange:24,salt:14357617,num:2,acc:"VALIDATED"},igloo:{id:"igloo",label:"Igloo",spacing:32,spawnRange:24,salt:14357617,num:2,acc:"VALIDATED"},ocean_monument:{id:"ocean_monument",label:"Ocean monument",spacing:32,spawnRange:27,salt:10387313,num:4,acc:"VALIDATED"},woodland_mansion:{id:"woodland_mansion",label:"Woodland mansion",spacing:80,spawnRange:60,salt:10387319,num:4,acc:"VALIDATED"},pillager_outpost:{id:"pillager_outpost",label:"Pillager outpost",spacing:80,spawnRange:56,salt:165745296,num:4,acc:"VALIDATED"},buried_treasure:{id:"buried_treasure",label:"Buried treasure",spacing:4,spawnRange:2,salt:16842397,num:4,acc:"VALIDATED"},shipwreck:{id:"shipwreck",label:"Shipwreck",spacing:10,spawnRange:5,salt:1,num:4,acc:"VALIDATED"},ocean_ruin:{id:"ocean_ruin",label:"Ocean ruin",spacing:12,spawnRange:5,salt:14357621,num:4,acc:"VALIDATED"},ruined_portal:{id:"ruined_portal",label:"Ruined portal",spacing:40,spawnRange:25,salt:40552231,num:4,acc:"VALIDATED"},nether_complex:{id:"nether_complex",label:"Nether fortress / bastion candidate",spacing:30,spawnRange:26,salt:430084232,num:4,acc:"VALIDATED"},end_city:{id:"end_city",label:"End city",spacing:20,spawnRange:9,salt:10387313,num:4,acc:"VALIDATED"},stronghold:{id:"stronghold",label:"Stronghold (approx)",spacing:0,spawnRange:0,salt:0,num:0,acc:"APPROXIMATE"}};
const IMPL=Object.values(S);
const PRESETS=[{name:"5 villages in 1k",rare:0,seeds:2000000,conds:[{id:"village",n:5,d:1000}]},{name:"Village + portal",rare:0,seeds:500000,conds:[{id:"village",n:1,d:400},{id:"ruined_portal",n:1,d:400}]},{name:"RARE: god spawn pack",rare:1,seeds:100000000,conds:[{id:"village",n:4,d:600},{id:"ruined_portal",n:1,d:400},{id:"pillager_outpost",n:1,d:700}]},{name:"IMPOSSIBLE: kitchen sink 0,0",rare:1,seeds:1000000000,conds:[{id:"village",n:5,d:700},{id:"ruined_portal",n:1,d:300},{id:"woodland_mansion",n:1,d:1200},{id:"stronghold",n:1,d:1200}]}];
const THEMES=[{id:"night",name:"Night teal"},{id:"cherry",name:"Cherry blossom"},{id:"blossom2",name:"Cherry dusk"},{id:"space",name:"Space"},{id:"car",name:"Car night"},{id:"nether",name:"Nether"},{id:"end",name:"The End"},{id:"ocean",name:"Ocean"},{id:"desert",name:"Desert"},{id:"snow",name:"Snow"},{id:"deep",name:"Deep dark"},{id:"village",name:"Village"},{id:"mansion",name:"Dark forest"}];
const TRACKS=[{name:"Spawn Plains",bpm:88,wave:"triangle",notes:[0,2,4,7,4,2,0,7]},{name:"Village Bells",bpm:96,wave:"sine",notes:[0,4,7,11,7,4,2,4]},{name:"Ocean Hunt",bpm:76,wave:"sine",notes:[0,3,5,7,10,7,5,3]},{name:"Nether Pulse",bpm:128,wave:"square",notes:[0,0,3,0,5,3,0,7]},{name:"End Void",bpm:64,wave:"triangle",notes:[0,7,3,10,7,3,0,12]},{name:"Mansion Hall",bpm:84,wave:"sawtooth",notes:[0,2,3,7,3,2,5,7]},{name:"Treasure Dive",bpm:110,wave:"triangle",notes:[4,0,7,4,9,7,4,0]},{name:"Stronghold Steps",bpm:100,wave:"square",notes:[0,2,0,5,0,7,5,2]},{name:"Cherry Wind",bpm:90,wave:"sine",notes:[0,2,4,5,7,5,4,2]},{name:"Desert March",bpm:118,wave:"sawtooth",notes:[0,3,5,0,7,5,3,0]},{name:"Jungle Drums",bpm:132,wave:"square",notes:[0,0,5,0,7,0,5,3]},{name:"Snow Night",bpm:72,wave:"sine",notes:[0,4,7,12,7,4,2,0]},{name:"Portal Hum",bpm:80,wave:"triangle",notes:[0,7,12,7,5,7,3,0]},{name:"Speedrun Beat",bpm:140,wave:"square",notes:[0,7,0,5,0,3,7,12]},{name:"Impossible Theme",bpm:92,wave:"sawtooth",notes:[0,3,7,10,12,10,7,3]},{name:"Deep Dark",bpm:70,wave:"triangle",notes:[0,5,3,8,5,0,8,12]}];
const SCALE=[261.63,293.66,329.63,349.23,392,440,493.88,523.25,587.33,659.25,698.46,783.99,880];
const ENGINE=`const S=${JSON.stringify(S)};function u32(x){return x>>>0}function twist(seed,i){return u32(Math.imul(1812433253,u32(seed)^u32(seed)>>>30)+i)}function temper(y){y^=y>>>11;y^=y<<7&2636928640;y^=y<<15&4022730752;return u32(y^y>>>18)}function mtN(seed,n,out){let a=u32(seed),b=twist(a,1);if(n===2){let extra=b;for(let i=2;i<397;i++)extra=twist(extra,i);const mag0=extra,mag1=twist(extra,397);let y=(a&0x80000000)+(b&0x7fffffff);var o=y&1;y=y>>>1^mag0;if(o)y^=2567483615;out[0]=temper(y);let c=twist(b,2);y=(b&0x80000000)+(c&0x7fffffff);o=y&1;y=y>>>1^mag1;if(o)y^=2567483615;out[1]=temper(y);return}const mt=new Uint32Array(n+1);mt[0]=a;mt[1]=b;for(let i=2;i<=n;i++)mt[i]=twist(mt[i-1],i);let extra=mt[n];for(let i=n;i<397;i++)extra=twist(extra,i+1);let mag=extra;for(let i=0;i<n;i++){if(i)mag=twist(mag,i+397);let y=(mt[i]&0x80000000)+(mt[i+1]&0x7fffffff);var o=y&1;y=y>>>1^mag;if(o)y^=2567483615;out[i]=temper(y)}}function saltMix(rx,rz,salt){return u32(salt-Math.imul(245998635,rz)-Math.imul(1724254968,rx))}function snap(chunk,spacing,off){let rem=chunk%spacing;if(rem<0)rem+=spacing;let d=off-rem;if(d<0)d+=spacing;return chunk+d}const BUF=new Uint32Array(4);function place(seed32,spec,rx,rz){mtN(u32(saltMix(rx,rz,spec.salt)+seed32),spec.num,BUF);let ox,oz;if(spec.num===2){ox=BUF[0]%spec.spawnRange;oz=BUF[1]%spec.spawnRange}else{ox=((BUF[0]%spec.spawnRange)+(BUF[1]%spec.spawnRange))>>1;oz=((BUF[2]%spec.spawnRange)+(BUF[3]%spec.spawnRange))>>1}return [(snap(rx*spec.spacing,spec.spacing,ox)<<4)+8,(snap(rz*spec.spacing,spec.spacing,oz)<<4)+8]}function dist2(x,z){return x*x+z*z}function scan(seed32,spec,maxd,hits){const maxd2=maxd*maxd;if(spec.id==="stronghold"){mtN(seed32,2,BUF);let ang=6.2831855*(BUF[0]*2.3283064365386963e-10),rad=(BUF[1]%16)+40;for(let i=0;i<3;i++){const x=(Math.cos(ang)*rad|0)<<4,z=(Math.sin(ang)*rad|0)<<4,d2=dist2(x,z);if(d2<=maxd2)hits.push({name:spec.id,label:spec.label,x:x,z:z,distance:Math.sqrt(d2),accuracy:spec.acc});ang+=1.8849558;rad+=8}return}const span=((maxd>>4)/spec.spacing|0)+2;for(let rx=-span;rx<=span;rx++)for(let rz=-span;rz<=span;rz++){const p=place(seed32,spec,rx,rz),d2=dist2(p[0],p[1]);if(d2<=maxd2)hits.push({name:spec.id,label:spec.label,x:p[0],z:p[1],distance:Math.sqrt(d2),accuracy:spec.acc})}}function grade(seed32,conds){const all=[];let parts=0;for(let i=0;i<conds.length;i++){const c=conds[i],spec=S[c.id];if(!spec)return null;const hits=[];scan(seed32,spec,c.d,hits);if(hits.length<c.n)return null;hits.sort((a,b)=>a.distance-b.distance);const used=hits.slice(0,c.n);let close=0;for(let k=0;k<used.length;k++)close+=1-used[k].distance/Math.max(c.d,1);parts+=0.58+0.42*(close/c.n);for(let k=0;k<used.length;k++)all.push(used[k])}return {seed:String(seed32>>>0),match:Math.min(99.9,100*parts/conds.length),hits:all}}`;
eval(ENGINE+";window.scan=scan;window.grade=grade;");
function parseSeed(raw){const t=String(raw||"").trim();if(/^-?\d+$/.test(t)){try{return {seed:BigInt(t),acc:"EXACT"}}catch(e){}}let h=0n;for(const ch of t)h=(h*31n+BigInt(ch.charCodeAt(0)))&((1n<<64n)-1n);return {seed:h,acc:"APPROXIMATE"}}
const view=document.getElementById("view");let page="home";
const state={conds:[{id:"village",n:5,d:1000}],seedCount:2000000,start:"0",workers:Math.min(8,navigator.hardwareConcurrency||4),stop99:true,random:false,running:false,stats:null,results:[],simSeed:"1",workersRef:[],volume:35,track:0,showRare:true,compact:false};
try{const saved=JSON.parse(localStorage.getItem("seed_settings")||"{}");Object.assign(state,saved, {running:false,stats:null,results:[],workersRef:[]})}catch(e){}
function saveSettings(){localStorage.setItem("seed_settings",JSON.stringify({seedCount:state.seedCount,start:state.start,workers:state.workers,stop99:state.stop99,random:state.random,volume:state.volume,track:state.track,showRare:state.showRare,compact:state.compact,simSeed:state.simSeed}))}
function setTheme(id){if(!THEMES.some(t=>t.id===id))id="night";document.documentElement.setAttribute("data-theme",id);localStorage.setItem("seed_theme",id)}
function setMotion(m){m=(m==="off"||m==="max")?m:"normal";document.documentElement.setAttribute("data-motion",m);localStorage.setItem("seed_motion",m)}
setTheme(localStorage.getItem("seed_theme")||"night");
setMotion(localStorage.getItem("seed_motion")||"normal");
let actx=null,gain=null,playing=false,tid=0,step=0;
function ensure(){if(actx)return;actx=new (window.AudioContext||window.webkitAudioContext)();gain=actx.createGain();gain.gain.value=state.volume/100;gain.connect(actx.destination)}
function beep(freq,dur,type,when){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0.0001,when);g.gain.exponentialRampToValueAtTime(0.12,when+0.02);g.gain.exponentialRampToValueAtTime(0.0001,when+dur);o.connect(g);g.connect(gain);o.start(when);o.stop(when+dur+0.02)}
function tick(){if(!playing||!actx)return;const tr=TRACKS[state.track];const now=actx.currentTime;beep(SCALE[tr.notes[step%tr.notes.length]],60/tr.bpm*.7,tr.wave,now);step++;tid=setTimeout(tick,60000/tr.bpm);const n=document.getElementById("nowPlay");if(n)n.textContent="Playing: "+tr.name+" · "+tr.bpm+" BPM"}
function play(){ensure();actx.resume();playing=true;clearTimeout(tid);tick();if(page==="music")render()}
function pause(){playing=false;clearTimeout(tid);if(page==="music")render()}
function badge(a){return `<span class="badge ${a}">${a}</span>`}
function opts(sel){return IMPL.map(s=>`<option value="${s.id}" ${s.id===sel?"selected":""}>${s.label}</option>`).join("")}
function visiblePresets(){return state.showRare?PRESETS:PRESETS.filter(p=>!p.rare)}
function applyPreset(i){const p=visiblePresets()[i];state.conds=p.conds.map(c=>({...c}));if(p.seeds)state.seedCount=p.seeds;saveSettings()}
document.querySelectorAll(".nav").forEach(btn=>{btn.onclick=()=>{document.querySelectorAll(".nav").forEach(b=>b.classList.remove("active"));btn.classList.add("active");page=btn.dataset.page;render()}});
function renderHome(){view.innerHTML=`<h2>Find a Bedrock seed</h2><p class="lead">Search is on the Search tab. Music and extra options are on their own tabs so the hunt screen stays clean.</p><div class="card row">${visiblePresets().map((p,i)=>`<button class="${p.rare?"":"secondary"}" data-p="${i}">${p.name}</button>`).join("")}</div><button data-go="search">Open Search</button>`;view.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{applyPreset(+b.dataset.p);document.querySelector('[data-page=search]').click()});view.querySelector("[data-go=search]").onclick=()=>document.querySelector('[data-page=search]').click()}
function renderSearch(){view.innerHTML=`<h2>Search</h2><div class="card row">${visiblePresets().map((p,i)=>`<button class="${p.rare?"":"secondary"}" data-p="${i}">${p.name}</button>`).join("")}</div><div class="card" id="conds"></div><button class="secondary" id="add">+ add structure</button><div class="card row"><label class="field">Seeds<input id="sc" type="number" min="1" max="1000000000" value="${state.seedCount}"></label><label class="field">Start seed<input id="ss" value="${state.start}"></label><label class="field">Workers<input id="wk" type="number" min="1" max="16" value="${state.workers}"></label><label class="field"><input id="r99" type="checkbox" ${state.stop99?"checked":""}> stop at 99%</label><label class="field"><input id="rnd" type="checkbox" ${state.random?"checked":""}> random</label><button id="go">Find seeds</button><button class="danger" id="stop">Stop</button></div><div id="stats"></div><div class="grid2"><div class="card"><table><thead><tr><th>#</th><th>Seed</th><th>Match</th></tr></thead><tbody id="rows"></tbody></table></div><div class="card" id="detail"><p class="note">Click a seed.</p></div></div>`;paintConds();paintResults();view.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{applyPreset(+b.dataset.p);paintConds();const sc=document.getElementById("sc");if(sc)sc.value=state.seedCount});document.getElementById("add").onclick=()=>{state.conds.push({id:"ruined_portal",n:1,d:800});paintConds()};document.getElementById("go").onclick=()=>{readForm();runSearch()};document.getElementById("stop").onclick=stopSearch}
function paintConds(){const box=document.getElementById("conds");if(!box)return;box.innerHTML=state.conds.map((c,i)=>`<div class="cond"><label class="field">I want<select data-k="id" data-i="${i}">${opts(c.id)}</select></label><label class="field">How many<input data-k="n" data-i="${i}" type="number" min="1" max="20" value="${c.n}"></label><label class="field">Within<input data-k="d" data-i="${i}" type="number" min="32" max="8000" value="${c.d}"></label><button class="ghost" data-del="${i}">x</button></div>`).join("");box.querySelectorAll("[data-k]").forEach(el=>el.oninput=()=>{const i=+el.dataset.i,k=el.dataset.k;state.conds[i][k]=k==="id"?el.value:+el.value});box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{state.conds.splice(+b.dataset.del,1);paintConds()})}
function readForm(){state.seedCount=Math.max(1,Math.min(1e9,+document.getElementById("sc").value||1));state.start=document.getElementById("ss").value;state.workers=Math.max(1,Math.min(16,+document.getElementById("wk").value||1));state.stop99=document.getElementById("r99").checked;state.random=document.getElementById("rnd").checked;saveSettings()}
function paintResults(){const stats=document.getElementById("stats"),rows=document.getElementById("rows");if(!stats||!rows)return;if(state.stats){const tested=Math.min(state.stats.tested||0,state.stats.total||0),total=state.stats.total||0,pct=total?Math.min(100,tested*100/total):0;stats.innerHTML=`<div class="card"><strong>Progress ${pct.toFixed(2)}%</strong><div class="bar"><i style="width:${pct.toFixed(2)}%"></i><span>${tested.toLocaleString()} / ${total.toLocaleString()}</span></div><div class="statgrid"><div class="stat">Status<b>${state.running?"running":"done"}</b></div><div class="stat">Speed<b>${Math.round(state.stats.sps).toLocaleString()}/s</b></div><div class="stat">Hits<b>${state.stats.matched.toLocaleString()}</b></div></div></div>`}rows.innerHTML=state.results.map((r,i)=>`<tr data-i="${i}"><td>${i+1}</td><td>${r.seed}</td><td class="match">${r.match.toFixed(1)}%</td></tr>`).join("");rows.querySelectorAll("tr").forEach(tr=>tr.onclick=()=>{const r=state.results[+tr.dataset.i];document.getElementById("detail").innerHTML=`<h3>${r.seed}</h3><p class="match">${r.match.toFixed(1)}%</p>${r.hits.map(h=>`<p>${h.label||h.name} — ${Math.round(h.distance)}m (${h.x},${h.z}) ${badge(h.accuracy)}</p>`).join("")}<button onclick="navigator.clipboard.writeText('${r.seed}')">Copy</button>`})}
function stopSearch(){state.running=false;state.workersRef.forEach(w=>{try{w.terminate()}catch(e){}});state.workersRef=[];if(page==="search")paintResults()}
function runSearch(){stopSearch();if(!state.conds.length)return;state.running=true;state.results=[];state.stats={tested:0,matched:0,sps:0,total:state.seedCount};paintResults();const n=state.workers,per=Math.ceil(state.seedCount/n),startLow=Number(parseSeed(state.start).seed&0xffffffffn)>>>0,t0=performance.now();let done=0;const live=Array(n).fill(0),liveMatch=Array(n).fill(0);const src=ENGINE+"\nonmessage=function(ev){var d=ev.data,results=[],matched=0;for(var i=0;i<d.count;i++){var s=d.random?((Math.random()*0x100000000)>>>0):((d.start+i)>>>0);var g=grade(s,d.conds);if(g){matched++;results.push(g);if(results.length>20){results.sort(function(a,b){return b.match-a.match});results.length=20}if(d.stop99&&g.match>=99){postMessage({type:'done',wid:d.wid,tested:i+1,matched:matched,results:results});return}}if((i&8191)===8191)postMessage({type:'prog',wid:d.wid,tested:i+1,matched:matched,results:null})}postMessage({type:'done',wid:d.wid,tested:d.count,matched:matched,results:results})}";for(let w=0;w<n;w++){const count=Math.max(0,Math.min(per,state.seedCount-w*per));if(!count){done++;continue}const worker=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})));state.workersRef.push(worker);worker.onmessage=ev=>{const m=ev.data;if(m.results&&m.results.length){const acc=new Map(state.results.map(r=>[r.seed,r]));for(const r of m.results)acc.set(r.seed,r);state.results=[...acc.values()].sort((a,b)=>b.match-a.match).slice(0,40)}if(typeof m.wid==="number"){live[m.wid]=m.tested||0;liveMatch[m.wid]=m.matched||0}if(m.type==="done"){done++;worker.terminate();if(state.stop99&&state.results.some(r=>r.match>=99))stopSearch();if(done>=n)state.running=false}state.stats.tested=live.reduce((a,b)=>a+b,0);state.stats.matched=liveMatch.reduce((a,b)=>a+b,0);state.stats.sps=(performance.now()-t0)>0?state.stats.tested*1000/(performance.now()-t0):0;if(page==="search")paintResults()};worker.postMessage({wid:w,start:(startLow+w*per)>>>0,count,random:state.random,conds:state.conds,stop99:state.stop99})}}
function renderSim(){view.innerHTML=`<h2>Simulator</h2><div class="card row"><label class="field">Seed<input id="sim" value="${state.simSeed}"></label><label class="field">Radius<input id="sr" type="number" value="2000"></label><button id="simgo">Simulate</button></div><div class="card" id="simout"></div>`;const run=()=>{state.simSeed=document.getElementById("sim").value;saveSettings();const parsed=parseSeed(state.simSeed);const seed32=Number(parsed.seed&0xffffffffn)>>>0;const r=+document.getElementById("sr").value;let html=`<p>${badge(parsed.acc)} ${seed32}</p>`;for(const spec of IMPL){const hits=[];scan(seed32,spec,r,hits);hits.sort((a,b)=>a.distance-b.distance);html+=`<p>${spec.label} ${badge(spec.acc)} — ${hits.length?hits.slice(0,4).map(h=>Math.round(h.distance)+"m").join(", "):"none"}</p>`}document.getElementById("simout").innerHTML=html};document.getElementById("simgo").onclick=run;run()}
function renderMusic(){view.innerHTML=`<h2>Music</h2><p class="lead">Music stays on this tab so Search stays clear. Tracks are original loops, not Minecraft songs.</p><div class="card row"><button id="mPlay">${playing?"Pause":"Play"}</button><button class="secondary" id="mPrev">Prev</button><button class="secondary" id="mNext">Next</button><label class="field">Volume<input id="vol" type="range" min="0" max="100" value="${state.volume}"></label></div><p class="note" id="nowPlay">${playing?("Playing: "+TRACKS[state.track].name):"Stopped"}</p><div class="card tracklist">${TRACKS.map((t,i)=>`<button class="${i===state.track?"on":"secondary"}" data-t="${i}">${i+1}. ${t.name} · ${t.bpm} BPM</button>`).join("")}</div>`;document.getElementById("mPlay").onclick=()=>playing?pause():play();
document.getElementById("mPrev").onclick=()=>{state.track=(state.track-1+TRACKS.length)%TRACKS.length;saveSettings();if(playing){pause();play()}else renderMusic()};
document.getElementById("mNext").onclick=()=>{state.track=(state.track+1)%TRACKS.length;saveSettings();if(playing){pause();play()}else renderMusic()};
document.getElementById("vol").oninput=e=>{state.volume=+e.target.value;if(gain)gain.gain.value=state.volume/100;saveSettings()};
view.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{state.track=+b.dataset.t;saveSettings();if(playing){pause();play()}else renderMusic()})}
function renderSettings(){const curTheme=document.documentElement.getAttribute("data-theme")||"night";const curMotion=document.documentElement.getAttribute("data-motion")||"normal";view.innerHTML=`<h2>Settings</h2><p class="lead">Looks, search defaults, and the old advanced tools live here. No overlay.</p>
<div class="card"><h3>Look</h3><div class="themes">${THEMES.map(t=>`<button class="${t.id===curTheme?"":"secondary"}" data-theme="${t.id}">${t.name}</button>`).join("")}</div>
<label class="field">Motion<select id="motion"><option value="off" ${curMotion==="off"?"selected":""}>Off</option><option value="normal" ${curMotion==="normal"?"selected":""}>Normal</option><option value="max" ${curMotion==="max"?"selected":""}>Over the top</option></select></label>
<label class="field"><input id="showRare" type="checkbox" ${state.showRare?"checked":""}> show rare / impossible hunts</label>
</div>
<div class="card"><h3>Search defaults</h3><div class="row">
<label class="field">Workers<input id="devWorkers" type="number" min="1" max="16" value="${state.workers}"></label>
<label class="field">Seeds<input id="devSeeds" type="number" min="1" max="1000000000" value="${state.seedCount}"></label>
<label class="field">Start seed<input id="devStart" value="${state.start}"></label>
<label class="field"><input id="devStop99" type="checkbox" ${state.stop99?"checked":""}> stop at 99%</label>
<label class="field"><input id="devRandom" type="checkbox" ${state.random?"checked":""}> random</label>
</div></div>
<div class="card"><h3>Tools</h3><div class="row">
<button id="devDump" class="secondary" type="button">Dump state</button>
<button id="devCopy" class="secondary" type="button">Copy results</button>
<button id="devClear" class="danger" type="button">Clear results</button>
<button id="devStop" class="danger" type="button">Stop search</button>
<button id="devReset" class="ghost" type="button">Reset settings</button>
</div><pre id="devLog" class="note" style="white-space:pre-wrap"></pre></div>`;
view.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{setTheme(b.dataset.theme);renderSettings()});
document.getElementById("motion").onchange=e=>{setMotion(e.target.value)};
document.getElementById("showRare").onchange=e=>{state.showRare=e.target.checked;saveSettings()};
document.getElementById("devWorkers").oninput=e=>{state.workers=Math.max(1,Math.min(16,+e.target.value||1));saveSettings()};
document.getElementById("devSeeds").oninput=e=>{state.seedCount=Math.max(1,Math.min(1e9,+e.target.value||1));saveSettings()};
document.getElementById("devStart").oninput=e=>{state.start=e.target.value;saveSettings()};
document.getElementById("devStop99").onchange=e=>{state.stop99=e.target.checked;saveSettings()};
document.getElementById("devRandom").onchange=e=>{state.random=e.target.checked;saveSettings()};
document.getElementById("devDump").onclick=()=>{document.getElementById("devLog").textContent=JSON.stringify({theme:document.documentElement.getAttribute("data-theme"),motion:document.documentElement.getAttribute("data-motion"),workers:state.workers,seedCount:state.seedCount,start:state.start,running:state.running,hits:state.results.length,track:TRACKS[state.track].name,themes:THEMES.map(t=>t.name)},null,2)};
document.getElementById("devCopy").onclick=()=>navigator.clipboard.writeText(JSON.stringify(state.results,null,2));
document.getElementById("devClear").onclick=()=>{state.results=[];state.stats=null};
document.getElementById("devStop").onclick=stopSearch;
document.getElementById("devReset").onclick=()=>{localStorage.removeItem("seed_settings");localStorage.removeItem("seed_theme");localStorage.removeItem("seed_motion");location.reload()}}
function renderAbout(){view.innerHTML=`<h2>Accuracy</h2><div class="card"><p>Structure candidates are ${badge("VALIDATED")}. Stronghold ring is ${badge("APPROXIMATE")}. Music is original generated loops.</p></div>`}
function render(){if(page==="home")renderHome();else if(page==="search")renderSearch();else if(page==="sim")renderSim();else if(page==="music")renderMusic();else if(page==="settings")renderSettings();else renderAbout()}
render();
</script></body></html>
