<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Seed — Bedrock Seed Hunter</title>
<style>
:root{--bg:#061018;--card:#101c2c;--ink:#eaf3fb;--muted:#8aa0b8;--accent:#3ee0c3;--accent2:#7cd4ff;--line:#22364c;--good:#5ad67a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(900px 500px at 8% -8%,#14344c 0%,var(--bg) 50%);color:var(--ink);font-family:Segoe UI,system-ui,sans-serif}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{background:#08141f;border-right:1px solid var(--line);padding:20px 14px}
nav.side h1{margin:0;letter-spacing:.2em;color:var(--accent)}
.sub{color:var(--muted);font-size:12px;margin:6px 0 16px}
nav.side .nav{display:block;width:100%;text-align:left;padding:9px 10px;margin:0 0 4px;color:var(--ink);background:0;border:0;border-radius:8px;font-size:14px;cursor:pointer}
nav.side .nav.active,nav.side .nav:hover{background:#163049}
main{padding:24px 28px 70px;max-width:1180px}
h2{margin:0 0 6px;font-size:30px}.lead{color:var(--muted);line-height:1.5;max-width:72ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:#0c1826;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.stat b{display:block;font-size:18px;margin-top:3px}
button{background:var(--accent);color:#06221f;border:0;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}
button.secondary{background:#1b3148;color:var(--ink)}button.ghost{background:transparent;color:var(--accent2);border:1px solid var(--line)}
button.danger{background:#3a1717;color:#ffb4b4}button:disabled{opacity:.5}
input,select{background:#0b1624;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
.badge.VALIDATED{background:#16351f;color:var(--good)}.badge.APPROXIMATE{background:#3a2e12;color:#e7b549}.badge.UNSUPPORTED{background:#3a1717;color:#e36b6b}.badge.EXACT{background:#12324a;color:#7cd4ff}
.note{color:var(--muted);font-size:13px;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}tr{cursor:pointer}tr:hover td{background:#15283c}
.cond{display:grid;grid-template-columns:1fr 88px 120px 36px;gap:8px;align-items:end;background:#0c1826;border:1px dashed #2b4560;border-radius:10px;padding:10px;margin:8px 0}
.pills button{font-size:12px;padding:7px 10px}
.bar{height:8px;background:#0b1624;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#3ee0c3,#7cd4ff)}
.match{font-weight:800;color:var(--good)}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}
canvas.map{width:100%;height:500px;display:block;background:#07131e;border-radius:12px;border:1px solid var(--line)}
@media(max-width:900px){.layout,.grid2,.cond{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
<nav class="side">
  <h1>SEED</h1>
  <div class="sub">Bedrock 1.21 · candidates</div>
  <button class="nav active" data-page="home">Home</button>
  <button class="nav" data-page="search">Search</button>
  <button class="nav" data-page="sim">Simulator</button>
  <button class="nav" data-page="map">Map</button>
  <button class="nav" data-page="about">Accuracy</button>
</nav>
<main id="view"></main>
</div>
<script>
const S = {
  village:{id:"village",label:"Village",spacing:27,spawnRange:17,salt:10387312,num:4,acc:"VALIDATED",ok:1},
  desert_pyramid:{id:"desert_pyramid",label:"Desert pyramid",spacing:32,spawnRange:24,salt:14357617,num:2,acc:"VALIDATED",ok:1},
  jungle_temple:{id:"jungle_temple",label:"Jungle temple",spacing:32,spawnRange:24,salt:14357617,num:2,acc:"VALIDATED",ok:1},
  swamp_hut:{id:"swamp_hut",label:"Swamp hut",spacing:32,spawnRange:24,salt:14357617,num:2,acc:"VALIDATED",ok:1},
  igloo:{id:"igloo",label:"Igloo",spacing:32,spawnRange:24,salt:14357617,num:2,acc:"VALIDATED",ok:1},
  ocean_monument:{id:"ocean_monument",label:"Ocean monument",spacing:32,spawnRange:27,salt:10387313,num:4,acc:"VALIDATED",ok:1},
  woodland_mansion:{id:"woodland_mansion",label:"Woodland mansion",spacing:80,spawnRange:60,salt:10387319,num:4,acc:"VALIDATED",ok:1},
  pillager_outpost:{id:"pillager_outpost",label:"Pillager outpost",spacing:80,spawnRange:56,salt:165745296,num:4,acc:"VALIDATED",ok:1},
  buried_treasure:{id:"buried_treasure",label:"Buried treasure",spacing:4,spawnRange:2,salt:16842397,num:4,acc:"VALIDATED",ok:1},
  shipwreck:{id:"shipwreck",label:"Shipwreck",spacing:10,spawnRange:5,salt:1,num:4,acc:"VALIDATED",ok:1},
  ocean_ruin:{id:"ocean_ruin",label:"Ocean ruin",spacing:12,spawnRange:5,salt:14357621,num:4,acc:"VALIDATED",ok:1},
  ruined_portal:{id:"ruined_portal",label:"Ruined portal",spacing:40,spawnRange:25,salt:40552231,num:4,acc:"VALIDATED",ok:1},
  nether_complex:{id:"nether_complex",label:"Nether fortress / bastion candidate",spacing:30,spawnRange:26,salt:430084232,num:4,acc:"VALIDATED",ok:1},
  end_city:{id:"end_city",label:"End city",spacing:20,spawnRange:9,salt:10387313,num:4,acc:"VALIDATED",ok:1},
  stronghold:{id:"stronghold",label:"Stronghold (approx)",spacing:0,spawnRange:0,salt:0,num:0,acc:"APPROXIMATE",ok:1},
  ancient_city:{id:"ancient_city",label:"Ancient city",acc:"UNSUPPORTED",ok:0}
};
const IMPL = Object.values(S).filter(x => x.ok);
const PRESETS = [
  {name:"5 villages in 1k", conds:[{id:"village",n:5,d:1000}]},
  {name:"Village + portal", conds:[{id:"village",n:1,d:400},{id:"ruined_portal",n:1,d:400}]},
  {name:"3 villages close", conds:[{id:"village",n:3,d:600}]},
  {name:"Monument hunt", conds:[{id:"ocean_monument",n:1,d:1500},{id:"shipwreck",n:2,d:800}]},
  {name:"Outpost + village", conds:[{id:"pillager_outpost",n:1,d:800},{id:"village",n:2,d:800}]},
  {name:"Stronghold nearby", conds:[{id:"stronghold",n:1,d:1500},{id:"village",n:1,d:700}]},
  {name:"Treasure + shipwreck", conds:[{id:"buried_treasure",n:3,d:500},{id:"shipwreck",n:2,d:500}]},
  {name:"Mansion run", conds:[{id:"woodland_mansion",n:1,d:2500},{id:"village",n:1,d:1200}]}
];

const ENGINE = `
const S = ${JSON.stringify(S)};
const u32 = x => x>>>0;
const low32 = seed => Number(BigInt(seed) & 0xffffffffn)>>>0;
function twistInit(seed,i){return u32(Math.imul(1812433253,u32(seed)^u32(seed)>>>30)+i)}
function mtFirst(seed,n){
  const mt=new Uint32Array(n+1), mag=new Uint32Array(n+1);
  mt[0]=u32(seed); for(let i=1;i<n+1;i++) mt[i]=twistInit(mt[i-1],i);
  let extra=mt[n]; for(let i=n;i<397;i++) extra=twistInit(extra,i+1);
  mag[0]=extra; for(let i=1;i<n+1;i++) mag[i]=twistInit(mag[i-1],i+397);
  for(let i=0;i<n;i++){const y=(mt[i]&0x80000000)+(mt[i+1]&0x7fffffff); mt[i]=y>>>1^mag[i]; if(y%2) mt[i]^=2567483615}
  const out=[]; for(let i=0;i<n;i++){let y=mt[i]; y^=y>>>11; y^=y<<7&2636928640; y^=y<<15&4022730752; y^=y>>>18; out.push(u32(y))} return out;
}
function saltMix(rx,rz,salt){return u32(salt-Math.imul(245998635,rz)-Math.imul(1724254968,rx))}
function snap(chunk,spacing,off){let rem=chunk%spacing; if(rem<0) rem+=spacing; let d=off-rem; if(d<0) d+=spacing; return chunk+d}
function candidateChunk(seed32,spec,rx,rz){
  const s=u32(saltMix(rx,rz,spec.salt)+seed32); const r=mtFirst(s,spec.num); let ox,oz;
  if(spec.num===2){ox=r[0]%spec.spawnRange; oz=r[1]%spec.spawnRange}
  else {ox=Math.floor(((r[0]%spec.spawnRange)+(r[1]%spec.spawnRange))/2); oz=Math.floor(((r[2]%spec.spawnRange)+(r[3]%spec.spawnRange))/2)}
  return {x:snap(rx*spec.spacing,spec.spacing,ox), z:snap(rz*spec.spacing,spec.spacing,oz)};
}
function blockOf(ch){return {x:ch.x*16+8,z:ch.z*16+8}}
function dist(x1,z1,x2,z2){const dx=x1-x2,dz=z1-z2; return Math.sqrt(dx*dx+dz*dz)}
function strongholds(seed32){
  const r=mtFirst(seed32,2); let ang=6.2831855*(u32(r[0])*2.3283064365386963e-10); let rad=(r[1]%16)+40; const out=[];
  for(let i=0;i<3;i++){out.push({x:Math.floor(Math.cos(ang)*rad)*16,z:Math.floor(Math.sin(ang)*rad)*16}); ang+=1.8849558; rad+=8}
  return out;
}
function collect(seed64,spec,area){
  const seed32=low32(seed64), hits=[];
  if(!spec||!spec.ok) return hits;
  if(spec.id==="stronghold"){
    for(const p of strongholds(seed32)){const d=dist(p.x,p.z,area.cx,area.cz); if(d<=area.r+1) hits.push({name:spec.id,label:spec.label,x:p.x,z:p.z,distance:d,accuracy:spec.acc})}
    return hits;
  }
  const minCx=Math.floor((area.cx-area.r)/16), maxCx=Math.floor((area.cx+area.r)/16);
  const minCz=Math.floor((area.cz-area.r)/16), maxCz=Math.floor((area.cz+area.r)/16);
  const rx0=Math.floor(minCx/spec.spacing)-1, rx1=Math.floor(maxCx/spec.spacing)+1;
  const rz0=Math.floor(minCz/spec.spacing)-1, rz1=Math.floor(maxCz/spec.spacing)+1;
  for(let rx=rx0;rx<=rx1;rx++) for(let rz=rz0;rz<=rz1;rz++){
    const b=blockOf(candidateChunk(seed32,spec,rx,rz)); const d=dist(b.x,b.z,area.cx,area.cz);
    if(d<=area.r) hits.push({name:spec.id,label:spec.label,x:b.x,z:b.z,distance:d,accuracy:spec.acc});
  }
  return hits;
}
function grade(seed, conds){
  const all=[]; let parts=0, pass=true;
  for(const c of conds){
    const spec=S[c.id]; if(!spec||!spec.ok){pass=false; break}
    const area={cx:0,cz:0,r:c.d};
    const hits=collect(seed,spec,area).filter(h=>h.distance<=c.d).sort((a,b)=>a.distance-b.distance);
    if(hits.length<c.n){pass=false; break}
    const used=hits.slice(0,c.n);
    const close=used.reduce((s,h)=>s+(1-h.distance/Math.max(c.d,1)),0)/c.n;
    parts += 0.58 + 0.42*close;
    all.push(...used);
  }
  if(!pass) return null;
  const match=Math.min(99.9, 100*parts/conds.length);
  return {seed:seed.toString(), match, hits:all};
}
`;

eval(ENGINE + ";window.__collect=collect;window.__grade=grade;window.__S=S;");

function parseSeed(raw){
  const t=String(raw||"").trim();
  if(/^-?\d+$/.test(t)){ try{return {seed:BigInt(t),acc:"EXACT"}}catch(e){} }
  let h=0n; for(const ch of t) h=(h*31n+BigInt(ch.charCodeAt(0)))&((1n<<64n)-1n);
  return {seed:h,acc:"APPROXIMATE"};
}

const view=document.getElementById("view");
let page="home";
const state={
  conds:[{id:"village",n:5,d:1000}],
  seedCount:1000000, start:"0", workers:Math.min(4, navigator.hardwareConcurrency||2),
  stop99:true, random:false, running:false, stats:null, results:[], selected:null, simSeed:"1",
  workersRef:[]
};

document.querySelectorAll(".nav").forEach(btn=>{
  btn.onclick=()=>{document.querySelectorAll(".nav").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); page=btn.dataset.page; render()}
});
function badge(a){return `<span class="badge ${a}">${a}</span>`}
function opts(sel){return IMPL.map(s=>`<option value="${s.id}" ${s.id===sel?"selected":""}>${s.label}</option>`).join("")}

function renderHome(){
  view.innerHTML=`
    <h2>Find a Bedrock seed</h2>
    <p class="lead">Say what you want — example: 5 villages within 1000 blocks of spawn. The hunter checks structure <em>candidates</em> and ranks seeds by match percent.</p>
    <div class="card pills row">
      ${PRESETS.map((p,i)=>`<button class="secondary" data-p="${i}">${p.name}</button>`).join("")}
    </div>
    <div class="card">
      <p>This is Bedrock only. A 99% match means every requested structure-candidate is present and unusually close to spawn for the distance you set.</p>
      <p>Biome / terrain checks are ${badge("UNSUPPORTED")} — confirm in-game with /locate.</p>
    </div>
    <button id="goSearch">Open Search</button>`;
  view.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{state.conds=PRESETS[+b.dataset.p].conds.map(c=>({...c})); document.querySelector('[data-page=search]').click()});
  document.getElementById("goSearch").onclick=()=>document.querySelector('[data-page=search]').click();
}

function renderSearch(){
  view.innerHTML=`
    <h2>Search</h2>
    <p class="lead">Add any mix of structures. Counts and distances are yours to change. Search can run up to 1,000,000,000 seeds in this browser.</p>
    <div class="card pills row">${PRESETS.map((p,i)=>`<button class="secondary" data-p="${i}">${p.name}</button>`).join("")}</div>
    <div class="card" id="conds"></div>
    <button class="secondary" id="add">+ add structure</button>
    <div class="card row">
      <label class="field">Seeds to try<input id="sc" type="number" min="1" max="1000000000" value="${state.seedCount}"></label>
      <label class="field">Start seed<input id="ss" value="${state.start}"></label>
      <label class="field">Workers<input id="wk" type="number" min="1" max="8" value="${state.workers}"></label>
      <label class="field"><input id="r99" type="checkbox" ${state.stop99?"checked":""}> stop at 99% match</label>
      <label class="field"><input id="rnd" type="checkbox" ${state.random?"checked":""}> random seeds</label>
      <button id="go">${state.running?"Searching…":"Find seeds"}</button>
      <button class="danger" id="stop">Stop</button>
    </div>
    <p class="note">1 billion seeds is allowed, but it is slow in a browser. A million is a good first run. Structure candidates only — not guaranteed to generate after biome checks.</p>
    <div id="stats"></div>
    <div class="grid2">
      <div class="card"><table><thead><tr><th>#</th><th>Seed</th><th>Match</th></tr></thead><tbody id="rows"></tbody></table></div>
      <div class="card" id="detail"><p class="note">Click a seed.</p></div>
    </div>`;
  paintConds(); paintResults();
  view.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{state.conds=PRESETS[+b.dataset.p].conds.map(c=>({...c})); paintConds()});
  document.getElementById("add").onclick=()=>{state.conds.push({id:"ruined_portal",n:1,d:800}); paintConds()};
  document.getElementById("go").onclick=()=>{readForm(); runSearch()};
  document.getElementById("stop").onclick=stopSearch;
}
function paintConds(){
  const box=document.getElementById("conds"); if(!box) return;
  box.innerHTML=state.conds.map((c,i)=>`
    <div class="cond">
      <label class="field">I want<select data-k="id" data-i="${i}">${opts(c.id)}</select></label>
      <label class="field">How many<input data-k="n" data-i="${i}" type="number" min="1" max="20" value="${c.n}"></label>
      <label class="field">Within blocks of spawn<input data-k="d" data-i="${i}" type="number" min="32" max="8000" value="${c.d}"></label>
      <button class="ghost" data-del="${i}">x</button>
    </div>`).join("") || "<p class='note'>Add at least one structure.</p>";
  box.querySelectorAll("[data-k]").forEach(el=>el.oninput=()=>{
    const i=+el.dataset.i, k=el.dataset.k;
    state.conds[i][k] = k==="id" ? el.value : Number(el.value);
  });
  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{state.conds.splice(+b.dataset.del,1); paintConds()});
}
function readForm(){
  state.seedCount=Math.max(1, Math.min(1000000000, Number(document.getElementById("sc").value)||1));
  state.start=document.getElementById("ss").value;
  state.workers=Math.max(1, Math.min(8, Number(document.getElementById("wk").value)||1));
  state.stop99=document.getElementById("r99").checked;
  state.random=document.getElementById("rnd").checked;
}
function paintResults(){
  const stats=document.getElementById("stats"); const rows=document.getElementById("rows");
  if(!stats||!rows) return;
  if(state.stats){
    const p=state.stats.total? state.stats.tested/state.stats.total : 0;
    const eta=state.stats.sps>0? Math.max(0,(state.stats.total-state.stats.tested)/state.stats.sps):0;
    stats.innerHTML=`<div class="statgrid">
      <div class="stat">Status<b>${state.running?"SEARCH RUNNING":"done"}</b></div>
      <div class="stat">Tried<b>${state.stats.tested.toLocaleString()}</b></div>
      <div class="stat">Speed<b>${Math.round(state.stats.sps).toLocaleString()}/s</b></div>
      <div class="stat">Hits<b>${state.stats.matched.toLocaleString()}</b></div>
      <div class="stat">ETA<b>${eta>90?(eta/60).toFixed(1)+" min":eta.toFixed(0)+"s"}</b></div>
    </div><div class="bar" style="margin-top:10px"><i style="width:${(p*100).toFixed(2)}%"></i></div>`;
  }
  rows.innerHTML=state.results.map((r,i)=>`<tr data-i="${i}"><td>${i+1}</td><td>${r.seed}</td><td class="match">${r.match.toFixed(1)}%</td></tr>`).join("");
  rows.querySelectorAll("tr").forEach(tr=>tr.onclick=()=>{
    const r=state.results[+tr.dataset.i]; state.selected=r; state.simSeed=r.seed;
    document.getElementById("detail").innerHTML=`<h3>SEED ${r.seed}</h3>
      <p class="match">${r.match.toFixed(1)}% match</p>
      <div class="bar"><i style="width:${r.match}%"></i></div>
      ${r.hits.map(h=>`<p>${h.label||h.name} — ${Math.round(h.distance)} blocks (${h.x}, ${h.z}) ${badge(h.accuracy)}</p>`).join("")}
      <div class="row" style="margin-top:10px">
        <button onclick="navigator.clipboard.writeText('${r.seed}')">Copy seed</button>
        <button class="secondary" id="openMap">Open map</button>
      </div>`;
    const om=document.getElementById("openMap"); if(om) om.onclick=()=>document.querySelector('[data-page=map]').click();
  });
}
function stopSearch(){
  state.running=false;
  state.workersRef.forEach(w=>{try{w.terminate()}catch(e){}}); state.workersRef=[];
  paintResults();
}
function runSearch(){
  stopSearch();
  if(!state.conds.length) return;
  state.running=true; state.results=[]; state.stats={tested:0,matched:0,sps:0,total:state.seedCount};
  paintResults();
  const n=state.workers; const per=Math.ceil(state.seedCount/n);
  const start=parseSeed(state.start).seed;
  const t0=performance.now();
  let done=0;
  const src = ENGINE + `
    onmessage = ev => {
      const {start, count, random, conds, stop99} = ev.data;
      const results=[]; let matched=0;
      for(let i=0;i<count;i++){
        const seed = random ? (BigInt(Math.floor(Math.random()*0x7fffffff))<<32n)+BigInt(Math.floor(Math.random()*0x7fffffff)) : start+BigInt(i);
        const g=grade(seed, conds);
        if(g){ matched++; results.push(g); results.sort((a,b)=>b.match-a.match); if(results.length>25) results.pop(); if(stop99 && g.match>=99){ postMessage({type:"done",tested:i+1,matched,results}); return; } }
        if((i&4095)===4095) postMessage({type:"prog",tested:i+1,matched,results});
      }
      postMessage({type:"done",tested:count,matched,results});
    };`;
  for(let w=0;w<n;w++){
    const count=Math.max(0, Math.min(per, state.seedCount-w*per)); if(!count){done++; continue}
    const blob=new Blob([src],{type:"text/javascript"});
    const worker=new Worker(URL.createObjectURL(blob));
    state.workersRef.push(worker);
    worker.onmessage=ev=>{
      const m=ev.data;
      const acc=new Map(state.results.map(r=>[r.seed,r]));
      for(const r of m.results||[]) acc.set(r.seed,r);
      state.results=[...acc.values()].sort((a,b)=>b.match-a.match).slice(0,40);
      if(m.type==="done"){
        state.stats.tested += m.tested; state.stats.matched += m.matched; done++;
        worker.terminate();
        if(done>=n || (state.stop99 && state.results.some(r=>r.match>=99))){
          if(state.stop99 && state.results.some(r=>r.match>=99)) stopSearch();
          state.running = done<n && !(state.stop99 && state.results.some(r=>r.match>=99));
          if(done>=n) state.running=false;
        }
      }
      const elapsed=performance.now()-t0;
      const tested=state.stats.tested + (m.type==="prog"?m.tested:0);
      state.stats.sps=elapsed>0? tested*1000/elapsed : 0;
      paintResults();
    };
    worker.postMessage({start: start+BigInt(w*per), count, random:state.random, conds:state.conds, stop99:state.stop99});
  }
}

function renderSim(){
  view.innerHTML=`<h2>Simulator</h2><p class="lead">All supported candidates around spawn for one seed.</p>
    <div class="card row"><label class="field">Seed<input id="sim" value="${state.simSeed}"></label>
    <label class="field">Radius<input id="sr" type="number" value="2000"></label><button id="simgo">Simulate</button></div>
    <div class="card" id="simout"></div>`;
  const run=()=>{
    state.simSeed=document.getElementById("sim").value; const r=Number(document.getElementById("sr").value);
    const parsed=parseSeed(state.simSeed); let html=`<p>Parse ${badge(parsed.acc)} · ${parsed.seed}</p>`;
    for(const spec of IMPL){
      const hits=__collect(parsed.seed,spec,{cx:0,cz:0,r}).sort((a,b)=>a.distance-b.distance).slice(0,5);
      html+=`<p><strong>${spec.label}</strong> ${badge(spec.acc)} — ${hits.length?hits.map(h=>`${Math.round(h.distance)}m (${h.x},${h.z})`).join(" · "):"none"}</p>`;
    }
    document.getElementById("simout").innerHTML=html;
  };
  document.getElementById("simgo").onclick=run; run();
}
function renderMap(){
  view.innerHTML=`<h2>Map</h2><p class="lead">Candidate overlay near spawn.</p>
    <div class="card row"><label class="field">Seed<input id="ms" value="${state.simSeed}"></label>
    <label class="field">Radius<input id="mr" type="number" value="2000"></label><button id="mdraw">Draw</button></div>
    <canvas class="map" id="cv"></canvas><p class="note" id="mnote"></p>`;
  const draw=()=>{
    state.simSeed=document.getElementById("ms").value; const rad=Number(document.getElementById("mr").value);
    const parsed=parseSeed(state.simSeed); const hits=[];
    for(const spec of IMPL) hits.push(...__collect(parsed.seed,spec,{cx:0,cz:0,r:rad}));
    const c=document.getElementById("cv"), ctx=c.getContext("2d");
    const w=c.width=c.clientWidth*devicePixelRatio, h=c.height=c.clientHeight*devicePixelRatio;
    ctx.fillStyle="#07131e"; ctx.fillRect(0,0,w,h);
    const scale=(Math.min(w,h)*0.42)/Math.max(rad,1);
    const to=(x,z)=>[w/2+x*scale,h/2+z*scale];
    ctx.strokeStyle="#1b3348";
    for(const ring of [500,1000,1500,rad]){ctx.beginPath(); const [x,y]=to(0,0); ctx.arc(x,y,ring*scale,0,Math.PI*2); ctx.stroke()}
    ctx.fillStyle="#3ee0c3"; const [sx,sz]=to(0,0); ctx.beginPath(); ctx.arc(sx,sz,5*devicePixelRatio,0,Math.PI*2); ctx.fill();
    for(const hit of hits){const [x,y]=to(hit.x,hit.z); ctx.fillStyle=hit.name==="village"?"#f0c14b":hit.name==="stronghold"?"#ff6b6b":"#7cd4ff"; ctx.beginPath(); ctx.arc(x,y,3.2*devicePixelRatio,0,Math.PI*2); ctx.fill()}
    document.getElementById("mnote").textContent=hits.length+" candidates · parse "+parsed.acc;
  };
  document.getElementById("mdraw").onclick=draw; draw();
}
function renderAbout(){
  view.innerHTML=`<h2>Accuracy</h2><div class="card">
    <p>${badge("VALIDATED")} candidate positions use published Bedrock salts / spacing / truncated MT19937. They can still fail biome or terrain checks.</p>
    <p>${badge("APPROXIMATE")} stronghold first ring only.</p>
    <p>${badge("UNSUPPORTED")} biomes, terrain, loot, Ancient City, exact world spawn.</p>
    <p>Match percent is closeness + count for the conditions you typed. 99% means the requested candidates exist and sit unusually close to 0,0 for the radius you chose. It is not a promise the structures generate in-world.</p>
    <p class="note"><a href="https://github.com/PopcornParty/Seed" style="color:#7cd4ff">github.com/PopcornParty/Seed</a></p>
  </div>`;
}
function render(){
  if(page==="home") renderHome(); else if(page==="search") renderSearch();
  else if(page==="sim") renderSim(); else if(page==="map") renderMap(); else renderAbout();
}
render();
</script>
</body>
</html>
