<!doctype html>
<html lang="en" data-motion="normal" data-theme="night"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Seed</title>
<style>
:root{--bg:#061018;--card:#101c2c;--ink:#eaf3fb;--muted:#8aa0b8;--accent:#3ee0c3;--line:#22364c;--good:#5ad67a;--glow:#14344c;--btnink:#06221f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:var(--ink);font-family:Segoe UI,system-ui,sans-serif}
body{background:radial-gradient(900px 500px at 8% -8%,var(--glow) 0%,var(--bg) 55%);background-color:var(--bg)}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav.side{border-right:1px solid var(--line);padding:20px 14px;background:var(--card)}
h1{margin:0;color:var(--accent);letter-spacing:.2em}
.sub,.lead,.note{color:var(--muted)}
.nav{display:block;width:100%;text-align:left;padding:10px 12px;margin:0 0 5px;color:var(--ink);background:0;border:0;border-radius:10px;cursor:pointer}
.nav.active,.nav:hover{background:#0003}
main{padding:24px 28px 50px;max-width:1100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{background:var(--accent);color:var(--btnink);border:0;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}
button.secondary{background:#1b3148;color:var(--ink)}button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button.danger{background:#3a1717;color:#ffb4b4}
input,select{background:#0b1624;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
.badge.VALIDATED{background:#16351f;color:var(--good)}.badge.APPROXIMATE{background:#3a2e12;color:#e7b549}.badge.UNSUPPORTED{background:#3a1717;color:#e36b6b}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.cond{display:grid;grid-template-columns:1fr 88px 120px 36px;gap:8px;background:#0c1826;border:1px dashed var(--line);border-radius:10px;padding:10px;margin:8px 0}
.bar{height:18px;background:#0b1624;border-radius:99px;overflow:hidden;border:1px solid var(--line);position:relative}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.match{font-weight:800;color:var(--good)}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}
html[data-theme=cherry]{--bg:#2a1520;--card:#3a1d2c;--ink:#ffeaf3;--muted:#e7b0c6;--accent:#ff9fc4;--line:#6a3348;--glow:#5a2438}
html[data-theme=space]{--bg:#07061a;--card:#14122c;--accent:#b48cff;--line:#322e5a;--glow:#24184a}
html[data-theme=car]{--bg:#0a1018;--card:#171e28;--accent:#ff3b3b;--btnink:#fff}
@media(max-width:900px){.layout,.grid2,.cond{grid-template-columns:1fr}}
</style></head>
<body>
<div class="layout"><nav class="side"><h1>SEED</h1><div class="sub">Bedrock 1.21</div>
<button class="nav active" data-page="home">Home</button>
<button class="nav" data-page="search">Search</button>
<button class="nav" data-page="sim">Simulator</button>
<button class="nav" data-page="music">Music</button>
<button class="nav" data-page="settings">Settings</button>
<button class="nav" data-page="about">Accuracy</button></nav>
<main id="view"></main></div>
<script>
const S={village:{id:"village",label:"Village",spacing:27,spawnRange:17,salt:10387312,num:4,acc:"VALIDATED"},jungle_temple:{id:"jungle_temple",label:"Jungle temple",spacing:32,spawnRange:24,salt:14357617,num:2,acc:"VALIDATED"},swamp_hut:{id:"swamp_hut",label:"Swamp hut",spacing:32,spawnRange:24,salt:14357617,num:2,acc:"VALIDATED"},igloo:{id:"igloo",label:"Igloo",spacing:32,spawnRange:24,salt:14357617,num:2,acc:"VALIDATED"},woodland_mansion:{id:"woodland_mansion",label:"Woodland mansion",spacing:80,spawnRange:60,salt:10387319,num:4,acc:"VALIDATED"},pillager_outpost:{id:"pillager_outpost",label:"Pillager outpost",spacing:80,spawnRange:56,salt:165745296,num:4,acc:"VALIDATED"},ruined_portal:{id:"ruined_portal",label:"Ruined portal",spacing:40,spawnRange:25,salt:40552231,num:4,acc:"VALIDATED"},ocean_monument:{id:"ocean_monument",label:"Ocean monument",spacing:32,spawnRange:27,salt:10387313,num:4,acc:"VALIDATED"},stronghold:{id:"stronghold",label:"Stronghold (approx)",spacing:0,spawnRange:0,salt:0,num:0,acc:"APPROXIMATE"},nether_complex:{id:"nether_complex",label:"Nether fortress / bastion candidate",spacing:30,spawnRange:26,salt:430084232,num:4,acc:"VALIDATED"},desert_pyramid:{id:"desert_pyramid",label:"Desert pyramid",spacing:32,spawnRange:24,salt:14357617,num:2,acc:"VALIDATED"},shipwreck:{id:"shipwreck",label:"Shipwreck",spacing:10,spawnRange:5,salt:1,num:4,acc:"VALIDATED"},buried_treasure:{id:"buried_treasure",label:"Buried treasure",spacing:4,spawnRange:2,salt:16842397,num:4,acc:"VALIDATED"}};
const IMPL=Object.values(S);
const WOODS=["oak","spruce","birch","jungle","acacia","dark oak","mangrove","cherry","pale oak","bamboo","crimson","warped"];
const BIOMES=[{id:"plains",label:"Plains",wood:"oak"},{id:"forest",label:"Forest",wood:"oak"},{id:"taiga",label:"Taiga",wood:"spruce"},{id:"snowy_taiga",label:"Snowy taiga",wood:"spruce"},{id:"old_growth_pine_taiga",label:"Old growth pine taiga",wood:"spruce"},{id:"birch_forest",label:"Birch forest",wood:"birch"},{id:"old_growth_birch_forest",label:"Old growth birch forest",wood:"birch"},{id:"jungle",label:"Jungle",wood:"jungle"},{id:"bamboo_jungle",label:"Bamboo jungle",wood:"bamboo"},{id:"savanna",label:"Savanna",wood:"acacia"},{id:"dark_forest",label:"Dark forest",wood:"dark oak"},{id:"mangrove_swamp",label:"Mangrove swamp",wood:"mangrove"},{id:"cherry_grove",label:"Cherry grove",wood:"cherry"},{id:"pale_garden",label:"Pale garden",wood:"pale oak"},{id:"crimson_forest",label:"Crimson forest",wood:"crimson"},{id:"warped_forest",label:"Warped forest",wood:"warped"}];
const PRESETS=[{name:"5 villages in 1k",rare:0,seeds:2000000,conds:[{kind:"structure",id:"village",n:5,d:1000}]},{name:"All woods near spawn",rare:0,seeds:50000000,note:"UNSUPPORTED for searching. One biome per wood type. This site will not invent biome coordinates.",conds:BIOMES.map(b=>({kind:"biome",id:b.id,n:1,d:1500}))},{name:"Village + portal",rare:0,seeds:500000,conds:[{kind:"structure",id:"village",n:1,d:400},{kind:"structure",id:"ruined_portal",n:1,d:400}]},{name:"RARE: god spawn pack",rare:1,seeds:100000000,conds:[{kind:"structure",id:"village",n:4,d:600},{kind:"structure",id:"ruined_portal",n:1,d:400},{kind:"structure",id:"pillager_outpost",n:1,d:700}]}];
const ENGINE=`const S=${JSON.stringify(S)};function u32(x){return x>>>0}function twist(seed,i){return u32(Math.imul(1812433253,u32(seed)^u32(seed)>>>30)+i)}function temper(y){y^=y>>>11;y^=y<<7&2636928640;y^=y<<15&4022730752;return u32(y^y>>>18)}function mtN(seed,n,out){let a=u32(seed),b=twist(a,1);if(n===2){let extra=b;for(let i=2;i<397;i++)extra=twist(extra,i);const mag0=extra,mag1=twist(extra,397);let y=(a&0x80000000)+(b&0x7fffffff);var o=y&1;y=y>>>1^mag0;if(o)y^=2567483615;out[0]=temper(y);let c=twist(b,2);y=(b&0x80000000)+(c&0x7fffffff);o=y&1;y=y>>>1^mag1;if(o)y^=2567483615;out[1]=temper(y);return}const mt=new Uint32Array(n+1);mt[0]=a;mt[1]=b;for(let i=2;i<=n;i++)mt[i]=twist(mt[i-1],i);let extra=mt[n];for(let i=n;i<397;i++)extra=twist(extra,i+1);let mag=extra;for(let i=0;i<n;i++){if(i)mag=twist(mag,i+397);let y=(mt[i]&0x80000000)+(mt[i+1]&0x7fffffff);var o=y&1;y=y>>>1^mag;if(o)y^=2567483615;out[i]=temper(y)}}function saltMix(rx,rz,salt){return u32(salt-Math.imul(245998635,rz)-Math.imul(1724254968,rx))}function snap(chunk,spacing,off){let rem=chunk%spacing;if(rem<0)rem+=spacing;let d=off-rem;if(d<0)d+=spacing;return chunk+d}const BUF=new Uint32Array(4);function place(seed32,spec,rx,rz){mtN(u32(saltMix(rx,rz,spec.salt)+seed32),spec.num,BUF);let ox,oz;if(spec.num===2){ox=BUF[0]%spec.spawnRange;oz=BUF[1]%spec.spawnRange}else{ox=((BUF[0]%spec.spawnRange)+(BUF[1]%spec.spawnRange))>>1;oz=((BUF[2]%spec.spawnRange)+(BUF[3]%spec.spawnRange))>>1}return [(snap(rx*spec.spacing,spec.spacing,ox)<<4)+8,(snap(rz*spec.spacing,spec.spacing,oz)<<4)+8]}function dist2(x,z){return x*x+z*z}function scan(seed32,spec,maxd,hits){const maxd2=maxd*maxd;if(spec.id==="stronghold"){mtN(seed32,2,BUF);let ang=6.2831855*(BUF[0]*2.3283064365386963e-10),rad=(BUF[1]%16)+40;for(let i=0;i<3;i++){const x=(Math.cos(ang)*rad|0)<<4,z=(Math.sin(ang)*rad|0)<<4,d2=dist2(x,z);if(d2<=maxd2)hits.push({name:spec.id,label:spec.label,x:x,z:z,distance:Math.sqrt(d2),accuracy:spec.acc});ang+=1.8849558;rad+=8}return}const span=((maxd>>4)/spec.spacing|0)+2;for(let rx=-span;rx<=span;rx++)for(let rz=-span;rz<=span;rz++){const p=place(seed32,spec,rx,rz),d2=dist2(p[0],p[1]);if(d2<=maxd2)hits.push({name:spec.id,label:spec.label,x:p[0],z:p[1],distance:Math.sqrt(d2),accuracy:spec.acc})}}function grade(seed32,conds){const all=[];let parts=0;for(let i=0;i<conds.length;i++){const c=conds[i],spec=S[c.id];if(!spec)return null;const hits=[];scan(seed32,spec,c.d,hits);if(hits.length<c.n)return null;hits.sort((a,b)=>a.distance-b.distance);const used=hits.slice(0,c.n);let close=0;for(let k=0;k<used.length;k++)close+=1-used[k].distance/Math.max(c.d,1);parts+=0.58+0.42*(close/c.n);for(let k=0;k<used.length;k++)all.push(used[k])}return {seed:String(seed32>>>0),match:Math.min(99.9,100*parts/conds.length),hits:all}}`;
eval(ENGINE+";window.scan=scan;window.grade=grade;");
function parseSeed(raw){const t=String(raw||"").trim();if(/^-?\d+$/.test(t)){try{return {seed:BigInt(t),acc:"EXACT"}}catch(e){}}let h=0n;for(const ch of t)h=(h*31n+BigInt(ch.charCodeAt(0)))&((1n<<64n)-1n);return {seed:h,acc:"APPROXIMATE"}}
const view=document.getElementById("view");let page="home";
const state={conds:PRESETS[0].conds.map(c=>({...c})),seedCount:2000000,start:"0",workers:Math.min(8,navigator.hardwareConcurrency||4),stop99:true,random:false,running:false,stats:null,results:[],workersRef:[],promptNote:""};
function badge(a){return `<span class="badge ${a}">${a}</span>`}
function opts(c){const sid=c.id,kind=c.kind||(S[sid]?"structure":"biome");let h='<optgroup label="Structures">';for(const s of IMPL)h+=`<option value="structure:${s.id}" ${kind==="structure"&&sid===s.id?"selected":""}>${s.label}</option>`;h+='</optgroup><optgroup label="Biomes (unsupported)">';for(const b of BIOMES)h+=`<option value="biome:${b.id}" ${kind==="biome"&&sid===b.id?"selected":""}>${b.label}${b.wood?" — "+b.wood:""}</option>`;return h+"</optgroup>"}
function applyPreset(i){const p=PRESETS[i];state.conds=p.conds.map(c=>({kind:c.kind||(S[c.id]?"structure":"biome"),...c}));state.seedCount=p.seeds||state.seedCount;state.promptNote=p.note||""}
document.querySelectorAll(".nav").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".nav").forEach(b=>b.classList.remove("active"));btn.classList.add("active");page=btn.dataset.page;render()});
function renderHome(){view.innerHTML=`<h2>Find a Bedrock seed</h2><p class="lead">You can add biomes in Search. Biome search is unsupported: this page has no verified Bedrock biome generator. All woods is one biome per wood type, not a fake map.</p><div class="card row">${PRESETS.map((p,i)=>`<button class="secondary" data-p="${i}">${p.name}</button>`).join("")}</div><button data-go="search">Open Search</button>`;view.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{applyPreset(+b.dataset.p);document.querySelector("[data-page=search]").click()});view.querySelector("[data-go]").onclick=()=>document.querySelector("[data-page=search]").click()}
function renderSearch(){view.innerHTML=`<h2>Search</h2><div class="card row">${PRESETS.map((p,i)=>`<button class="secondary" data-p="${i}">${p.name}</button>`).join("")}</div>${state.promptNote?`<div class="card"><p class="note">${state.promptNote}</p><p class="note">Woods: ${WOODS.join(", ")}.</p></div>`:""}<div class="card" id="conds"></div><button class="secondary" id="add">+ structure</button><button class="secondary" id="addb">+ biome</button><div class="card row"><label class="field">Seeds<input id="sc" type="number" value="${state.seedCount}"></label><label class="field">Start<input id="ss" value="${state.start}"></label><label class="field">Workers<input id="wk" type="number" min="1" max="16" value="${state.workers}"></label><button id="go">Find seeds</button><button class="danger" id="stop">Stop</button></div><div id="stats"></div><div class="grid2"><div class="card"><table><thead><tr><th>#</th><th>Seed</th><th>Match</th></tr></thead><tbody id="rows"></tbody></table></div><div class="card" id="detail"><p class="note">Click a seed.</p></div></div>`;paintConds();paintResults();view.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{applyPreset(+b.dataset.p);renderSearch()});document.getElementById("add").onclick=()=>{state.conds.push({kind:"structure",id:"ruined_portal",n:1,d:800});paintConds()};document.getElementById("addb").onclick=()=>{state.conds.push({kind:"biome",id:"cherry_grove",n:1,d:1500});paintConds()};document.getElementById("go").onclick=()=>{state.seedCount=Math.max(1,Math.min(1e9,+document.getElementById("sc").value||1));state.start=document.getElementById("ss").value;state.workers=Math.max(1,Math.min(16,+document.getElementById("wk").value||1));runSearch()};document.getElementById("stop").onclick=stopSearch}
function paintConds(){const box=document.getElementById("conds");if(!box)return;box.innerHTML=state.conds.map((c,i)=>`<div class="cond"><label class="field">I want<select data-k="sel" data-i="${i}">${opts(c)}</select></label><label class="field">How many<input data-k="n" data-i="${i}" type="number" value="${c.n}"></label><label class="field">Within<input data-k="d" data-i="${i}" type="number" value="${c.d}"></label><button class="ghost" data-del="${i}">x</button></div>`).join("");box.querySelectorAll("[data-k]").forEach(el=>el.oninput=()=>{const c=state.conds[+el.dataset.i],k=el.dataset.k;if(k==="sel"){const p=el.value.split(":");c.kind=p[0];c.id=p[1]}else c[k]=+el.value});box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{state.conds.splice(+b.dataset.del,1);paintConds()})}
function paintResults(){const stats=document.getElementById("stats"),rows=document.getElementById("rows");if(!stats||!rows)return;if(state.stats){const tested=Math.min(state.stats.tested||0,state.stats.total||0),total=state.stats.total||0,pct=total?tested*100/total:0;stats.innerHTML=`<div class="card"><strong>Progress ${pct.toFixed(2)}%</strong><div class="bar"><i style="width:${pct}%"></i><span>${tested.toLocaleString()} / ${total.toLocaleString()}</span></div></div>`}rows.innerHTML=state.results.map((r,i)=>`<tr data-i="${i}"><td>${i+1}</td><td>${r.seed}</td><td class="match">${r.match.toFixed(1)}%</td></tr>`).join("");rows.querySelectorAll("tr").forEach(tr=>tr.onclick=()=>{const r=state.results[+tr.dataset.i];document.getElementById("detail").innerHTML=`<h3>${r.seed}</h3>${r.hits.map(h=>`<p>${h.label||h.name} — ${Math.round(h.distance)}m ${badge(h.accuracy)}</p>`).join("")}<button onclick="navigator.clipboard.writeText('${r.seed}')">Copy</button>`})}
function stopSearch(){state.running=false;state.workersRef.forEach(w=>{try{w.terminate()}catch(e){}});state.workersRef=[];if(page==="search")paintResults()}
function runSearch(){stopSearch();const biomeConds=(state.conds||[]).filter(c=>(c.kind||(S[c.id]?"structure":"biome"))==="biome");if(biomeConds.length){const stats=document.getElementById("stats");if(stats)stats.innerHTML=`<div class="card"><p class="note">Biome search is unsupported. This engine does not generate Bedrock biomes, so it will not invent cherry groves or other biome points. Remove biome rows to search structures.</p><p class="note">Biome rows: ${biomeConds.map(c=>c.id).join(", ")}.</p></div>`;if(!state.conds.some(c=>(c.kind||"structure")==="structure"&&S[c.id]))return}state.running=true;state.results=[];state.stats={tested:0,matched:0,sps:0,total:state.seedCount};paintResults();const n=state.workers,per=Math.ceil(state.seedCount/n),startLow=Number(parseSeed(state.start).seed&0xffffffffn)>>>0,t0=performance.now();let done=0;const live=Array(n).fill(0),liveMatch=Array(n).fill(0);const src=ENGINE+"\nonmessage=function(ev){var d=ev.data,results=[],matched=0;for(var i=0;i<d.count;i++){var s=((d.start+i)>>>0);var g=grade(s,d.conds);if(g){matched++;results.push(g);if(results.length>20)results.length=20}if((i&8191)===8191)postMessage({type:'prog',wid:d.wid,tested:i+1,matched:matched,results:null})}postMessage({type:'done',wid:d.wid,tested:d.count,matched:matched,results:results})}";for(let w=0;w<n;w++){const count=Math.max(0,Math.min(per,state.seedCount-w*per));if(!count){done++;continue}const worker=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})));state.workersRef.push(worker);worker.onmessage=ev=>{const m=ev.data;if(m.results&&m.results.length){const acc=new Map(state.results.map(r=>[r.seed,r]));for(const r of m.results)acc.set(r.seed,r);state.results=[...acc.values()].sort((a,b)=>b.match-a.match).slice(0,40)}if(typeof m.wid==="number"){live[m.wid]=m.tested||0;liveMatch[m.wid]=m.matched||0}if(m.type==="done"){done++;worker.terminate();if(done>=n)state.running=false}state.stats.tested=live.reduce((a,b)=>a+b,0);state.stats.matched=liveMatch.reduce((a,b)=>a+b,0);state.stats.sps=(performance.now()-t0)>0?state.stats.tested*1000/(performance.now()-t0):0;if(page==="search")paintResults()};worker.postMessage({wid:w,start:(startLow+w*per)>>>0,count,conds:state.conds.filter(c=>(c.kind||"structure")!=="biome"&&S[c.id]),stop99:state.stop99})}}
function renderSim(){view.innerHTML=`<h2>Simulator</h2><div class="card row"><input id="sim" value="1"><button id="simgo">Simulate</button></div><div class="card" id="out"></div>`;document.getElementById("simgo").onclick=()=>{const seed32=Number(parseSeed(document.getElementById("sim").value).seed&0xffffffffn)>>>0;let html="";for(const spec of IMPL){const hits=[];scan(seed32,spec,2000,hits);hits.sort((a,b)=>a.distance-b.distance);html+=`<p>${spec.label} ${badge(spec.acc)} — ${hits.slice(0,3).map(h=>Math.round(h.distance)+"m").join(", ")||"none"}</p>`}document.getElementById("out").innerHTML=html}}
function renderMusic(){view.innerHTML=`<h2>Music</h2><p class="note">Music lives on this tab only.</p>`}
function renderSettings(){view.innerHTML=`<h2>Settings</h2><div class="card row"><button data-th="night">Night</button><button data-th="cherry">Cherry blossom</button><button data-th="space">Space</button><button data-th="car">Car night</button></div>`;view.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>document.documentElement.setAttribute("data-theme",b.dataset.th))}
function renderAbout(){view.innerHTML=`<h2>Accuracy</h2><div class="card"><p>Structures ${badge("VALIDATED")}. Biomes ${badge("UNSUPPORTED")}. All woods is a biome prompt, not a computed biome map.</p></div>`}
function render(){if(page==="home")renderHome();else if(page==="search")renderSearch();else if(page==="sim")renderSim();else if(page==="music")renderMusic();else if(page==="settings")renderSettings();else renderAbout()}
render();
</script></body></html>
