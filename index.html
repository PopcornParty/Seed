<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Seed — Bedrock Seed Hunter</title>
<style>
:root{--bg:#061018;--card:#101c2c;--ink:#eaf3fb;--muted:#8aa0b8;--accent:#3ee0c3;--line:#22364c;--good:#5ad67a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(900px 500px at 8% -8%,#14344c 0%,var(--bg) 50%);color:var(--ink);font-family:Segoe UI,system-ui,sans-serif}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{background:#08141f;border-right:1px solid var(--line);padding:20px 14px}
nav.side h1{margin:0;letter-spacing:.2em;color:var(--accent)}
.sub{color:var(--muted);font-size:12px;margin:6px 0 16px}
.nav{display:block;width:100%;text-align:left;padding:9px 10px;margin:0 0 4px;color:var(--ink);background:0;border:0;border-radius:8px;font-size:14px;cursor:pointer}
.nav.active,.nav:hover{background:#163049}
main{padding:24px 28px 70px;max-width:1180px}
h2{margin:0 0 6px;font-size:30px}.lead{color:var(--muted);line-height:1.5;max-width:72ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:#0c1826;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.stat b{display:block;font-size:18px;margin-top:3px}
button{background:var(--accent);color:#06221f;border:0;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}
button.secondary{background:#1b3148;color:var(--ink)}button.ghost{background:transparent;color:#7cd4ff;border:1px solid var(--line)}
button.danger{background:#3a1717;color:#ffb4b4}
input,select{background:#0b1624;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
.badge.VALIDATED{background:#16351f;color:var(--good)}.badge.APPROXIMATE{background:#3a2e12;color:#e7b549}.badge.UNSUPPORTED{background:#3a1717;color:#e36b6b}.badge.EXACT{background:#12324a;color:#7cd4ff}
.note{color:var(--muted);font-size:13px;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}tr{cursor:pointer}tr:hover td{background:#15283c}
.cond{display:grid;grid-template-columns:1fr 88px 120px 36px;gap:8px;align-items:end;background:#0c1826;border:1px dashed #2b4560;border-radius:10px;padding:10px;margin:8px 0}
.pills button{font-size:12px;padding:7px 10px}
.bar{height:18px;background:#0b1624;border-radius:99px;overflow:hidden;border:1px solid var(--line);position:relative}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ee0c3,#7cd4ff)}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#eaf3fb;text-shadow:0 1px 2px #000}
.match{font-weight:800;color:var(--good)}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}
@media(max-width:900px){.layout,.grid2,.cond{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
<nav class="side">
  <h1>SEED</h1>
  <div class="sub">Bedrock 1.21 · no map</div>
  <button class="nav active" data-page="home">Home</button>
  <button class="nav" data-page="search">Search</button>
  <button class="nav" data-page="sim">Simulator</button>
  <button class="nav" data-page="about">Accuracy</button>
</nav>
<main id="view"></main>
</div>
<script>
const S={
 village:{id:"village",label:"Village",spacing:27,spawnRange:17,salt:10387312,num:4,acc:"VALIDATED",ok:1},
 desert_pyramid:{id:"desert_pyramid",label:"Desert pyramid",spacing:32,spawnRange:24,salt:14357617,num:2,acc:"VALIDATED",ok:1},
 jungle_temple:{id:"jungle_temple",label:"Jungle temple",spacing:32,spawnRange:24,salt:14357617,num:2,acc:"VALIDATED",ok:1},
 swamp_hut:{id:"swamp_hut",label:"Swamp hut",spacing:32,spawnRange:24,salt:14357617,num:2,acc:"VALIDATED",ok:1},
 igloo:{id:"igloo",label:"Igloo",spacing:32,spawnRange:24,salt:14357617,num:2,acc:"VALIDATED",ok:1},
 ocean_monument:{id:"ocean_monument",label:"Ocean monument",spacing:32,spawnRange:27,salt:10387313,num:4,acc:"VALIDATED",ok:1},
 woodland_mansion:{id:"woodland_mansion",label:"Woodland mansion",spacing:80,spawnRange:60,salt:10387319,num:4,acc:"VALIDATED",ok:1},
 pillager_outpost:{id:"pillager_outpost",label:"Pillager outpost",spacing:80,spawnRange:56,salt:165745296,num:4,acc:"VALIDATED",ok:1},
 buried_treasure:{id:"buried_treasure",label:"Buried treasure",spacing:4,spawnRange:2,salt:16842397,num:4,acc:"VALIDATED",ok:1},
 shipwreck:{id:"shipwreck",label:"Shipwreck",spacing:10,spawnRange:5,salt:1,acc:"VALIDATED",ok:1,num:4},
 ocean_ruin:{id:"ocean_ruin",label:"Ocean ruin",spacing:12,spawnRange:5,salt:14357621,num:4,acc:"VALIDATED",ok:1},
 ruined_portal:{id:"ruined_portal",label:"Ruined portal",spacing:40,spawnRange:25,salt:40552231,num:4,acc:"VALIDATED",ok:1},
 nether_complex:{id:"nether_complex",label:"Nether fortress / bastion candidate",spacing:30,spawnRange:26,salt:430084232,num:4,acc:"VALIDATED",ok:1},
 end_city:{id:"end_city",label:"End city",spacing:20,spawnRange:9,salt:10387313,num:4,acc:"VALIDATED",ok:1},
 stronghold:{id:"stronghold",label:"Stronghold (approx)",spacing:0,spawnRange:0,salt:0,num:0,acc:"APPROXIMATE",ok:1}
};
const IMPL=Object.values(S);
const PRESETS=[
 {name:"5 villages in 1k",conds:[{id:"village",n:5,d:1000}]},
 {name:"Village + portal",conds:[{id:"village",n:1,d:400},{id:"ruined_portal",n:1,d:400}]},
 {name:"3 villages close",conds:[{id:"village",n:3,d:600}]},
 {name:"Monument hunt",conds:[{id:"ocean_monument",n:1,d:1500},{id:"shipwreck",n:2,d:800}]},
 {name:"Outpost + village",conds:[{id:"pillager_outpost",n:1,d:800},{id:"village",n:2,d:800}]},
 {name:"Stronghold nearby",conds:[{id:"stronghold",n:1,d:1500},{id:"village",n:1,d:700}]},
 {name:"Treasure + shipwreck",conds:[{id:"buried_treasure",n:3,d:500},{id:"shipwreck",n:2,d:500}]},
 {name:"Mansion run",conds:[{id:"woodland_mansion",n:1,d:2500},{id:"village",n:1,d:1200}]}
];

const ENGINE=`
const S=${JSON.stringify(S)};
function u32(x){return x>>>0}
function twist(seed,i){return u32(Math.imul(1812433253,u32(seed)^u32(seed)>>>30)+i)}
function temper(y){y^=y>>>11;y^=y<<7&2636928640;y^=y<<15&4022730752;return u32(y^y>>>18)}
function mtN(seed,n,out){
  let a=u32(seed), b=twist(a,1);
  if(n===2){
    let extra=b; for(let i=2;i<397;i++) extra=twist(extra,i);
    const mag0=extra, mag1=twist(extra,397);
    let y=(a&0x80000000)+(b&0x7fffffff); y=y>>>1^mag0; if(y<<31) y^=2567483615; out[0]=temper(y);
    let c=twist(b,2); y=(b&0x80000000)+(c&0x7fffffff); y=y>>>1^mag1; if(y<<31) y^=2567483615; out[1]=temper(y);
    return;
  }
  const mt=new Uint32Array(n+1); mt[0]=a; mt[1]=b;
  for(let i=2;i<=n;i++) mt[i]=twist(mt[i-1],i);
  let extra=mt[n]; for(let i=n;i<397;i++) extra=twist(extra,i+1);
  let mag=extra;
  for(let i=0;i<n;i++){
    if(i) mag=twist(mag,i+397);
    let y=(mt[i]&0x80000000)+(mt[i+1]&0x7fffffff);
    y=y>>>1^mag; if(y<<31) y^=2567483615; out[i]=temper(y);
  }
}
function saltMix(rx,rz,salt){return u32(salt-Math.imul(245998635,rz)-Math.imul(1724254968,rx))}
function snap(chunk,spacing,off){let rem=chunk%spacing;if(rem<0)rem+=spacing;let d=off-rem;if(d<0)d+=spacing;return chunk+d}
const BUF=new Uint32Array(4);
function place(seed32,spec,rx,rz){
  mtN(u32(saltMix(rx,rz,spec.salt)+seed32),spec.num,BUF);
  let ox,oz;
  if(spec.num===2){ox=BUF[0]%spec.spawnRange;oz=BUF[1]%spec.spawnRange}
  else{ox=((BUF[0]%spec.spawnRange)+(BUF[1]%spec.spawnRange))>>1;oz=((BUF[2]%spec.spawnRange)+(BUF[3]%spec.spawnRange))>>1}
  const cx=snap(rx*spec.spacing,spec.spacing,ox), cz=snap(rz*spec.spacing,spec.spacing,oz);
  return [(cx<<4)+8,(cz<<4)+8];
}
function dist2(x,z){return x*x+z*z}
function strongholds(seed32,maxd2,need,hits){
  mtN(seed32,2,BUF);
  let ang=6.2831855*(BUF[0]*2.3283064365386963e-10), rad=(BUF[1]%16)+40, n=0;
  for(let i=0;i<3;i++){
    const x=(Math.cos(ang)*rad|0)<<4, z=(Math.sin(ang)*rad|0)<<4;
    const d2=dist2(x,z);
    if(d2<=maxd2){hits.push({name:"stronghold",label:S.stronghold.label,x:x,z:z,distance:Math.sqrt(d2),accuracy:"APPROXIMATE"});n++}
    ang+=1.8849558; rad+=8;
  }
  return n;
}
function scan(seed32,spec,maxd,need,hits){
  const maxd2=maxd*maxd;
  if(spec.id==="stronghold") return strongholds(seed32,maxd2,need,hits);
  const span=((maxd>>4)/spec.spacing|0)+2;
  let found=0;
  for(let rx=-span;rx<=span;rx++){
    for(let rz=-span;rz<=span;rz++){
      const p=place(seed32,spec,rx,rz);
      const d2=dist2(p[0],p[1]);
      if(d2<=maxd2){
        hits.push({name:spec.id,label:spec.label,x:p[0],z:p[1],distance:Math.sqrt(d2),accuracy:spec.acc});
        found++;
      }
    }
  }
  return found;
}
function grade(seed32, conds){
  const all=[]; let parts=0;
  for(let i=0;i<conds.length;i++){
    const c=conds[i], spec=S[c.id]; if(!spec) return null;
    const hits=[];
    scan(seed32,spec,c.d,c.n,hits);
    if(hits.length<c.n) return null;
    hits.sort((a,b)=>a.distance-b.distance);
    const used=hits.slice(0,c.n);
    let close=0; for(let k=0;k<used.length;k++) close+=1-used[k].distance/Math.max(c.d,1);
    parts+=0.58+0.42*(close/c.n);
    for(let k=0;k<used.length;k++) all.push(used[k]);
  }
  return {seed:String(seed32>>>0), match:Math.min(99.9,100*parts/conds.length), hits:all};
}
`;

eval(ENGINE+";window.__collect=(seed,spec,area)=>{const h=[];scan(Number(seed)&0xffffffff,spec,area.r,99,h);return h};window.__grade=grade;");

function parseSeed(raw){
  const t=String(raw||"").trim();
  if(/^-?\d+$/.test(t)){try{return {seed:BigInt(t),acc:"EXACT"}}catch(e){}}
  let h=0n; for(const ch of t) h=(h*31n+BigInt(ch.charCodeAt(0)))&((1n<<64n)-1n);
  return {seed:h,acc:"APPROXIMATE"};
}
const view=document.getElementById("view");
let page="home";
const state={conds:[{id:"village",n:5,d:1000}],seedCount:1000000,start:"0",workers:Math.min(8,navigator.hardwareConcurrency||4),stop99:true,random:false,running:false,stats:null,results:[],selected:null,simSeed:"1",workersRef:[]};
document.querySelectorAll(".nav").forEach(btn=>{btn.onclick=()=>{document.querySelectorAll(".nav").forEach(b=>b.classList.remove("active"));btn.classList.add("active");page=btn.dataset.page;render()}});
function badge(a){return `<span class="badge ${a}">${a}</span>`}
function opts(sel){return IMPL.map(s=>`<option value="${s.id}" ${s.id===sel?"selected":""}>${s.label}</option>`).join("")}
function renderHome(){
  view.innerHTML=`<h2>Find a Bedrock seed</h2><p class="lead">No map. Search uses every CPU worker your browser will give it. Speed depends on how many structures you ask for — keep conditions small for a faster hunt.</p><div class="card pills row">${PRESETS.map((p,i)=>`<button class="secondary" data-p="${i}">${p.name}</button>`).join("")}</div><button id="goSearch">Open Search</button>`;
  view.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{state.conds=PRESETS[+b.dataset.p].conds.map(c=>({...c}));document.querySelector('[data-page=search]').click()});
  document.getElementById("goSearch").onclick=()=>document.querySelector('[data-page=search]').click();
}
function renderSearch(){
  view.innerHTML=`<h2>Search</h2><p class="lead">Workers search in parallel. Progress shows seeds done / seeds asked and the live seeds/sec.</p><div class="card pills row">${PRESETS.map((p,i)=>`<button class="secondary" data-p="${i}">${p.name}</button>`).join("")}</div><div class="card" id="conds"></div><button class="secondary" id="add">+ add structure</button><div class="card row"><label class="field">Seeds to try<input id="sc" type="number" min="1" max="1000000000" value="${state.seedCount}"></label><label class="field">Start seed<input id="ss" value="${state.start}"></label><label class="field">Workers<input id="wk" type="number" min="1" max="16" value="${state.workers}"></label><label class="field"><input id="r99" type="checkbox" ${state.stop99?"checked":""}> stop at 99% match</label><label class="field"><input id="rnd" type="checkbox" ${state.random?"checked":""}> random seeds</label><button id="go">Find seeds</button><button class="danger" id="stop">Stop</button></div><p class="note">500,000 seeds/sec is the target on a fast PC with a simple condition. Heavy lists (5 villages + extra structures) are slower because each seed needs more Bedrock RNG. The number on screen is the real measured speed.</p><div id="stats"></div><div class="grid2"><div class="card"><table><thead><tr><th>#</th><th>Seed</th><th>Match</th></tr></thead><tbody id="rows"></tbody></table></div><div class="card" id="detail"><p class="note">Click a seed.</p></div></div>`;
  paintConds();paintResults();
  view.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{state.conds=PRESETS[+b.dataset.p].conds.map(c=>({...c}));paintConds()});
  document.getElementById("add").onclick=()=>{state.conds.push({id:"ruined_portal",n:1,d:800});paintConds()};
  document.getElementById("go").onclick=()=>{readForm();runSearch()};
  document.getElementById("stop").onclick=stopSearch;
}
function paintConds(){
  const box=document.getElementById("conds"); if(!box) return;
  box.innerHTML=state.conds.map((c,i)=>`<div class="cond"><label class="field">I want<select data-k="id" data-i="${i}">${opts(c.id)}</select></label><label class="field">How many<input data-k="n" data-i="${i}" type="number" min="1" max="20" value="${c.n}"></label><label class="field">Within blocks of spawn<input data-k="d" data-i="${i}" type="number" min="32" max="8000" value="${c.d}"></label><button class="ghost" data-del="${i}">x</button></div>`).join("");
  box.querySelectorAll("[data-k]").forEach(el=>el.oninput=()=>{const i=+el.dataset.i,k=el.dataset.k;state.conds[i][k]=k==="id"?el.value:Number(el.value)});
  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{state.conds.splice(+b.dataset.del,1);paintConds()});
}
function readForm(){
  state.seedCount=Math.max(1,Math.min(1000000000,Number(document.getElementById("sc").value)||1));
  state.start=document.getElementById("ss").value;
  state.workers=Math.max(1,Math.min(16,Number(document.getElementById("wk").value)||1));
  state.stop99=document.getElementById("r99").checked;
  state.random=document.getElementById("rnd").checked;
}
function paintResults(){
  const stats=document.getElementById("stats"), rows=document.getElementById("rows");
  if(!stats||!rows) return;
  if(state.stats){
    const tested=Math.min(state.stats.tested||0,state.stats.total||0), total=state.stats.total||0;
    const pct=total?Math.min(100,tested*100/total):0;
    const eta=state.stats.sps>0?Math.max(0,(total-tested)/state.stats.sps):0;
    stats.innerHTML=`<div class="card" style="margin-top:0"><div class="row" style="justify-content:space-between;margin-bottom:8px"><strong>Search progress</strong><span class="match">${pct.toFixed(2)}%</span></div><div class="bar"><i style="width:${pct.toFixed(2)}%"></i><span>${tested.toLocaleString()} / ${total.toLocaleString()} · ${pct.toFixed(1)}%</span></div></div><div class="statgrid"><div class="stat">Status<b>${state.running?"SEARCH RUNNING":"done"}</b></div><div class="stat">Searched<b>${tested.toLocaleString()} / ${total.toLocaleString()}</b></div><div class="stat">Percent<b>${pct.toFixed(2)}%</b></div><div class="stat">Speed<b>${Math.round(state.stats.sps).toLocaleString()}/s</b></div><div class="stat">Hits<b>${state.stats.matched.toLocaleString()}</b></div><div class="stat">ETA<b>${eta>90?(eta/60).toFixed(1)+" min":eta.toFixed(0)+"s"}</b></div></div>`;
  }
  rows.innerHTML=state.results.map((r,i)=>`<tr data-i="${i}"><td>${i+1}</td><td>${r.seed}</td><td class="match">${r.match.toFixed(1)}%</td></tr>`).join("");
  rows.querySelectorAll("tr").forEach(tr=>tr.onclick=()=>{const r=state.results[+tr.dataset.i];state.selected=r;state.simSeed=r.seed;document.getElementById("detail").innerHTML=`<h3>SEED ${r.seed}</h3><p class="match">${r.match.toFixed(1)}% match</p>${r.hits.map(h=>`<p>${h.label||h.name} — ${Math.round(h.distance)} blocks (${h.x}, ${h.z}) ${badge(h.accuracy)}</p>`).join("")}<button onclick="navigator.clipboard.writeText('${r.seed}')">Copy seed</button>`});
}
function stopSearch(){state.running=false;state.workersRef.forEach(w=>{try{w.terminate()}catch(e){}});state.workersRef=[];paintResults()}
function runSearch(){
  stopSearch(); if(!state.conds.length) return;
  state.running=true;state.results=[];state.stats={tested:0,matched:0,sps:0,total:state.seedCount};paintResults();
  const n=state.workers, per=Math.ceil(state.seedCount/n), startLow=Number(parseSeed(state.start).seed & 0xffffffffn)>>>0, t0=performance.now();
  let done=0; const live=Array(n).fill(0), liveMatch=Array(n).fill(0);
  const src=ENGINE+"\nonmessage=function(ev){var d=ev.data,results=[],matched=0,seed=d.start>>>0;for(var i=0;i<d.count;i++){var s=d.random?((Math.random()*0x100000000)>>>0):((d.start+i)>>>0);var g=grade(s,d.conds);if(g){matched++;results.push(g);if(results.length>20){results.sort(function(a,b){return b.match-a.match});results.length=20}if(d.stop99&&g.match>=99){postMessage({type:'done',wid:d.wid,tested:i+1,matched:matched,results:results});return}}if((i&8191)===8191)postMessage({type:'prog',wid:d.wid,tested:i+1,matched:matched,results:null})}postMessage({type:'done',wid:d.wid,tested:d.count,matched:matched,results:results})}";
  for(let w=0;w<n;w++){
    const count=Math.max(0,Math.min(per,state.seedCount-w*per)); if(!count){done++;continue}
    const worker=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})));
    state.workersRef.push(worker);
    worker.onmessage=ev=>{
      const m=ev.data;
      if(m.results&&m.results.length){
        const acc=new Map(state.results.map(r=>[r.seed,r]));
        for(const r of m.results) acc.set(r.seed,r);
        state.results=[...acc.values()].sort((a,b)=>b.match-a.match).slice(0,40);
      }
      if(typeof m.wid==="number"){live[m.wid]=m.tested||0;liveMatch[m.wid]=m.matched||0}
      if(m.type==="done"){done++;worker.terminate();if(state.stop99&&state.results.some(r=>r.match>=99))stopSearch();if(done>=n)state.running=false}
      state.stats.tested=live.reduce((a,b)=>a+b,0);state.stats.matched=liveMatch.reduce((a,b)=>a+b,0);
      const elapsed=performance.now()-t0;state.stats.sps=elapsed>0?state.stats.tested*1000/elapsed:0;paintResults();
    };
    worker.postMessage({wid:w,start:(startLow+w*per)>>>0,count,random:state.random,conds:state.conds,stop99:state.stop99});
  }
}
function renderSim(){
  view.innerHTML=`<h2>Simulator</h2><div class="card row"><label class="field">Seed<input id="sim" value="${state.simSeed}"></label><label class="field">Radius<input id="sr" type="number" value="2000"></label><button id="simgo">Simulate</button></div><div class="card" id="simout"></div>`;
  const run=()=>{state.simSeed=document.getElementById("sim").value;const r=Number(document.getElementById("sr").value);const parsed=parseSeed(state.simSeed);const seed32=Number(parsed.seed&0xffffffffn)>>>0;let html=`<p>Parse ${badge(parsed.acc)} · low32 ${seed32}</p>`;for(const spec of IMPL){const hits=[];scan(seed32,spec,r,99,hits);hits.sort((a,b)=>a.distance-b.distance);html+=`<p><strong>${spec.label}</strong> ${badge(spec.acc)} — ${hits.length?hits.slice(0,5).map(h=>Math.round(h.distance)+"m ("+h.x+","+h.z+")").join(" · "):"none"}</p>`}document.getElementById("simout").innerHTML=html};
  document.getElementById("simgo").onclick=run;run();
}
function renderAbout(){view.innerHTML=`<h2>Accuracy</h2><div class="card"><p>${badge("VALIDATED")} structure candidates. ${badge("APPROXIMATE")} stronghold ring. Map removed. Speed is measured live; 500,000/s is a target, not a fake counter.</p></div>`}
function render(){if(page==="home")renderHome();else if(page==="search")renderSearch();else if(page==="sim")renderSim();else renderAbout()}
render();
</script>
</body>
</html>
